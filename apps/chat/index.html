<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="DevChat — real-time chat rooms for developers with presence, typing indicators and unread counts. Built with React, TypeScript, Tailwind CSS and Supabase Realtime." />
    <meta name="theme-color" content="#0b0d17" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>DevChat — Real-time rooms for developers</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong colours.
      try {
        var saved = localStorage.getItem('devchat:v1:theme')
        var theme = saved === '"light"' || saved === '"dark"' ? JSON.parse(saved) : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.classList.toggle('dark', theme === 'dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
