<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ResumeForge — build ATS-friendly resumes and cover letters with professional templates, live multi-page preview, an ATS checker, job-description keyword matching and PDF export. Runs entirely in your browser." />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint (avoids a light flash in dark mode).
      try {
        var t = (JSON.parse(localStorage.getItem('resumeforge-v1') || '{}').state || {}).theme || 'system'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch (e) {}
    </script>
    <title>ResumeForge — Free ATS-Friendly Resume Builder</title>
    <meta name="author" content="Jeevan" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ResumeForge — Free ATS-Friendly Resume Builder" />
    <meta property="og:description" content="13 professional templates, live multi-page preview, ATS checker, job-description keyword match, cover letters and PDF/Word export. Private: runs entirely in your browser." />
    <meta property="og:url" content="https://resumeforge-jeevan.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://resumeforge-jeevan.vercel.app/" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>ResumeForge needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
